name: Portfolio readiness

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Use Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Run repository and composite gates
        run: npm run check

      - name: Verify staging configuration
        run: npm run preflight:staging

      - name: Verify production configuration
        run: npm run preflight:production

      - name: Verify the exact-candidate Docker runtime
        run: npm run check:docker-runtime -- --output "$RUNNER_TEMP/docker-runtime.json"

      - name: Record exact-candidate verification
        run: npm run report:candidate-verification -- --output "$RUNNER_TEMP/candidate-verification.json"
