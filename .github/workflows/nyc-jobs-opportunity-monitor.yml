name: NYC Jobs opportunity monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyc-jobs-opportunity-monitor
  cancel-in-progress: false

jobs:
  refresh-rank-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refresh, rank, and render the governed digest
        run: npm run opportunities:nyc:daily
      - name: Run deterministic opportunity evals
        run: npm run evals:opportunities && npm run test:opportunities
      - name: Retain the review packet
        uses: actions/upload-artifact@v4
        with:
          name: nyc-jobs-opportunity-review-${{ github.run_id }}
          retention-days: 14
          path: |
            data/opportunities/nyc-jobs-current.json
            reports/opportunities/nyc-jobs-current.md
            reports/opportunities/nyc-jobs-daily-digest.md
