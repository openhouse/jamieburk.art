name: irl-changelog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm run test:irl-changelog
      - run: npm run test:irl-rfc
      - run: npm run evals:irl-rfc
